name: CI

# PARKED: GitHub Actions on this private repo is blocked by an
# account billing/spending-limit setting, so automatic runs would
# only produce noise. The full suite gates every milestone LOCALLY
# in the meantime. To activate CI once billing is resolved (or the
# repo goes public), replace the trigger below with:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#
# and run once via: gh workflow run ci.yml
on:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache GHC (the oracle)
        uses: actions/cache@v4
        with:
          path: ~/.ghcup
          key: ghcup-9.4.8-${{ runner.os }}

      - name: Install GHC 9.4.8
        run: |
          if [ ! -x "$HOME/.ghcup/bin/runghc" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org \
              | BOOTSTRAP_HASKELL_NONINTERACTIVE=1 BOOTSTRAP_HASKELL_MINIMAL=1 sh
            "$HOME/.ghcup/bin/ghcup" install ghc 9.4.8 --set
          fi
          "$HOME/.ghcup/bin/runghc" --version

      - uses: alire-project/setup-alire@v4

      - name: Select GNAT toolchain
        run: alr -n toolchain --select gnat_native gprbuild

      - name: Build (validation - contracts on)
        run: alr -n build --validation

      - name: Build (release)
        run: alr -n build --release && alr -n build --validation

      - name: Unit tests (219)
        run: |
          cd tests
          alr -n build
          ./bin/ahc_tests

      - name: Goldens
        run: scripts/run_golden.sh

      - name: Parse differential
        run: scripts/run_differential.sh

      - name: Type differential
        run: scripts/run_differential_types.sh

      - name: Conformance (byte-identical to GHC)
        run: scripts/run_conformance.sh

      - name: Execution tests
        run: scripts/run_exec.sh

      - name: Examples (dogfood)
        run: scripts/run_examples.sh

      - name: Separate-compilation proofs
        run: scripts/run_separate.sh

      - name: Contract discharge proofs
        run: scripts/run_discharge.sh

      - name: REPL transcripts
        run: scripts/run_repl.sh

      - name: Fuzz (50 seeds)
        run: scripts/run_fuzz.sh 50 1

  # The own collector (AHC_GC=own) is Darwin-only today: it reads
  # thread stack bounds with pthread_get_stackaddr_np and the data
  # segment through dyld. Both have Linux equivalents
  # (pthread_getattr_np, __data_start/_end) and neither is written,
  # because writing them untested is how this project acquires
  # bugs. So the collector is gated on macOS and the Linux port is
  # its own piece of work.
  #
  # These two steps exist because of M114/M115: a live-data-loss
  # bug survived five milestones of "soak clean" runs, because
  # every one of them used a single collection cadence and only
  # ever compared final OUTPUT. The soak now varies the cadence,
  # and AHC_OWN_VERIFY proves the mark set is closed under
  # points-to at every collection - which is what actually found
  # the bug, in one run.
  collector:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: alire-project/setup-alire@v4

      - name: Select GNAT toolchain
        run: alr -n toolchain --select gnat_native gprbuild

      - name: Build (validation - contracts on)
        run: alr -n build --validation

      - name: Boehm collector (default) still green
        run: scripts/run_exec.sh

      - name: Own collector - correctness across GC cadences
        # five trigger floors x minor and major, each run proving
        # mark-set closure, all compared against the Boehm build
        run: scripts/run_own_soak.sh

      - name: Own collector - exec suite, verified, tight trigger
        # the whole exec suite under AHC_GC=own with collections
        # forced often and closure checked at every one of them
        env:
          AHC_GC: own
          AHC_OWN_VERIFY: "1"
          AHC_OWN_MIN: "4000000"
        run: scripts/run_exec.sh

      - name: Spin watchdog fires, and reports the right thing
        # The watchdog traps a hang that reproduced ONCE in 44
        # attempts, so it runs essentially never and a refactor
        # could break it silently - discovered only on the one
        # occasion it matters. This makes it fire on purpose and
        # checks the dump identifies the owner, the tag, the GC
        # rendezvous state and the spark deques. Both M119
        # watchdogs were wrong on their first attempt; "it
        # compiles" is not evidence that a trap works.
        run: scripts/run_watchdog_check.sh

      - name: Thread sanitizer (spark protocol + own allocator)
        run: scripts/run_tsan.sh
